name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[api,db,test]" "ruff==0.15.21"
      - name: Lint
        run: ruff check src tests
      - name: Run native checks
        run: make check
      - name: Run coverage gate
        run: python -m pytest
